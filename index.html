<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Realistic Reverse Goal Map</title>
<style>
:root {
  --bg:#eef2f7; --surface:#ffffff; --text:#111827; --muted:#667085; --soft:#f8fafc;
  --line:#dbe3ee; --line-strong:#c7d2e3; --ink:#0f172a; --blue:#2563eb;
  --teal:#0f766e; --green:#16a34a; --amber:#d97706; --red:#dc2626;
  --shadow:0 18px 45px rgba(15,23,42,.10); --shadow-sm:0 10px 24px rgba(15,23,42,.07);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:
  radial-gradient(circle at top left,rgba(37,99,235,.12),transparent 30rem),
  linear-gradient(180deg,#f7f9fc 0,#eef2f7 42rem);color:var(--text);line-height:1.5}
button,select,input{font:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid rgba(37,99,235,.24);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:28px 18px 64px}
.hero{position:relative;overflow:hidden;background:#111827;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.hero:before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 82% 18%,rgba(20,184,166,.36),transparent 18rem),
  radial-gradient(circle at 18% 10%,rgba(59,130,246,.32),transparent 16rem),
  linear-gradient(135deg,#0f172a 0,#172033 58%,#0f766e 100%);z-index:0}
.hero:after{content:"";position:absolute;right:-90px;bottom:-120px;width:340px;height:340px;border:1px solid rgba(255,255,255,.16);border-radius:50%;box-shadow:0 0 0 54px rgba(255,255,255,.04)}
.hero>*{position:relative;z-index:1}
.kicker{display:inline-flex;gap:9px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800;margin-bottom:18px;color:#e0f2fe}
.kicker:before{content:"\2195";display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.16);font-size:12px}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.02;margin:0 0 12px;font-weight:900;letter-spacing:0}
.hero p{color:#dbeafe;font-size:18px;margin:0;max-width:860px}
.hero-metrics{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.metric-chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);color:#f8fafc;font-weight:800;font-size:13px}
.icon{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.toolbar{position:sticky;top:0;z-index:10;background:rgba(238,242,247,.9);backdrop-filter:blur(16px);padding:12px 0;display:grid;grid-template-columns:1.1fr 1.25fr 1fr auto auto;gap:10px;margin-bottom:10px}
.control{position:relative;min-width:0}
.control .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#64748b;pointer-events:none}
.toolbar input,.toolbar select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 40px;background:#fff;color:var(--ink);min-width:0;box-shadow:0 1px 0 rgba(15,23,42,.03)}
.toolbar select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#64748b 50%),linear-gradient(135deg,#64748b 50%,transparent 50%);background-position:calc(100% - 18px) 51%,calc(100% - 13px) 51%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.btn{border:0;border-radius:14px;padding:12px 14px;background:var(--ink);color:#fff;font-weight:850;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-sm)}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn:hover,.tab:hover,.step-card>summary:hover{transform:translateY(-1px)}
.path-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.path-summary{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:20px;border-bottom:1px solid var(--line);background:#fbfdff}
.path-summary::-webkit-details-marker,.step-card>summary::-webkit-details-marker{display:none}
.path-title{display:flex;align-items:center;gap:14px;min-width:0}
.num{width:44px;height:44px;background:#eff6ff;color:var(--blue);border:1px solid #bfdbfe;border-radius:14px;display:grid;place-items:center;font-weight:900;flex:0 0 auto}
.path-card h2{margin:0 0 4px;font-size:24px;line-height:1.15}
.path-card p{margin:0;color:var(--muted)}
.goal-fit{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#dbeafe;border-radius:16px;padding:12px 16px;text-align:center;min-width:120px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.goal-fit span{font-size:13px;display:block}
.goal-fit b{font-size:25px;color:#fff}
.path-body{padding:20px;background:#fff}
.evidence{background:#ecfdf5;border:1px solid #bbf7d0;color:#14532d;border-radius:15px;padding:14px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:850;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .18s ease,transform .18s ease}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.panel{display:none}
.panel.active{display:block}
.step-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;background:#fff}
.step-card>summary{list-style:none;cursor:pointer;padding:16px;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;transition:background .18s ease,transform .18s ease}
.step-card[open]>summary{background:#f8fafc;border-bottom:1px solid var(--line)}
.step-head{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.step-index{width:36px;height:36px;border-radius:12px;background:#f1f5f9;color:#334155;display:grid;place-items:center;font-size:13px;font-weight:900;border:1px solid var(--line)}
.step-label{display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900;margin-bottom:8px}
.step-card h3{margin:0;font-size:18px;max-width:820px;line-height:1.25}
.step-card .note{font-size:13px;color:var(--muted);margin-top:6px}
.step-score{display:grid;grid-template-columns:auto auto;gap:5px 10px;background:#111827;color:#fff;border-radius:15px;padding:12px;min-width:198px}
.step-score span{font-size:12px;color:#cbd5e1}
.step-score b{text-align:right}
.step-content{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;background:#fbfdff}
.rating-table-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;overflow:auto}
.rating-table-wrap h4,.panel h3{margin:0 0 4px;font-size:18px}
.hint{font-size:13px;margin:0 0 12px!important;color:var(--muted)}
.rating-table{width:100%;border-collapse:collapse;min-width:540px}
.rating-table th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);padding:9px}
.rating-table td{border-bottom:1px solid #eef0f4;padding:10px 9px;vertical-align:middle}
.rating-table tr:last-child td{border-bottom:0}
.compare-rating{display:grid;grid-template-columns:1fr 116px;gap:10px;align-items:center}
.bar{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:999px}
.nums b{display:block;text-align:right}
.nums small{display:block;text-align:right;color:var(--muted);font-size:12px}
.gap{display:inline-grid;place-items:center;min-width:34px;height:28px;border-radius:999px;font-weight:900;background:#fee2e2;color:#991b1b}
.gap.building{background:#fef3c7;color:#92400e}
.gap.complete{background:#dcfce7;color:#166534}
.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
@media(max-width:1000px){
  .toolbar{grid-template-columns:1fr}
  .step-content{grid-template-columns:1fr}
  .path-summary{flex-direction:column;align-items:flex-start}
  .goal-fit{width:100%}
  .step-card>summary{flex-direction:column}
  .step-score{width:100%}
}
@media(max-width:620px){
  .wrap{padding:16px 12px 44px}
  .hero{padding:24px;border-radius:20px}
  .hero h1{font-size:34px}
  .path-title,.step-head{grid-template-columns:1fr}
  .path-card h2{font-size:21px}
}
@media print{
  .toolbar,.tabs{display:none!important}
  .panel{display:block!important}
  body{background:#fff}
  .path-card,.hero,.stat{box-shadow:none;break-inside:avoid}
}
</style>
</head>

    <label class="control"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg><select id="goalSelect" aria-label="Select goal"></select></label>

const goalSelect = document.getElementById('goalSelect');
const pathSelect = document.getElementById('pathSelect');
const search = document.getElementById('search');
const cards = document.getElementById('cards');

function clean(str) {
  return String(str)
    .replace(/\u00c2\u00b7/g, '\u00b7')
    .replace(/\u00e2\u20ac\u201d/g, '\u2014')
    .replace(/\u00e2\u20ac\u201c/g, '\u2013')
    .replace(/\u00e2\u2020\u2019/g, '\u2192');
}
function esc(str) {
  return clean(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}
function icon(name) {
  const icons = {
    target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',
    route:'<path d="M3 17 9 7l4 6 3-4 5 8z"/><path d="M3 17h18"/>',
    chart:'<path d="M4 19V5"/><path d="M8 19v-4"/><path d="M12 19V9"/><path d="M16 19v-7"/><path d="M20 19V7"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M11 12h1v5h1"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
    table:'<path d="M3 5h18v14H3z"/><path d="M3 10h18"/><path d="M9 5v14"/>'
  };
  return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name] || icons.target}</svg>`;
}
function goalIcon(goalId) {
  if (goalId === 'physicalHealth') return 'chart';
  if (goalId === 'relationship') return 'user';
  return 'target';
}
function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
function stepRating(attr, step) {
  const factors = step.factors || {default:0};
  const factor = factors[attr.group] ?? factors.default ?? 0;
  return clamp(Math.round(attr.final * factor), 0, attr.final);
}

  if (gap <= 0) return 'complete';
  if (gap <= 2) return 'building';
  return 'early';
}

  if (!attrs.length) return 0;
  const total = attrs.reduce((sum, attr) => sum + stepRating(attr, step), 0);
  return Math.round(total / attrs.length);
}
function ratingRow(attr, step) {
  const score = stepRating(attr, step);
  const gap = attr.final - score;
  return `<tr>
    <td><strong>${esc(attr.name)}</strong></td>
    <td><div class="compare-rating"><div class="bar"><span style="width:${score * 10}%"></span></div><div class="nums"><b>${score}/10</b><small>Final ${attr.final}/10 · Gap ${gap}</small></div></div></td>
    <td><span class="gap ${gapClass(gap)}">${gap}</span></td>
  </tr>`;
}
function finalRow(attr) {
  return `<tr>
    <td><strong>${esc(attr.name)}</strong></td>
    <td><div class="compare-rating"><div class="bar"><span style="width:${attr.final * 10}%"></span></div><div class="nums"><b>${attr.final}/10</b><small>Final rating</small></div></div></td>
    <td><span class="gap complete">0</span></td>
  </tr>`;
}
function tableHtml(title, hint, attrs, step=null) {
  const rows = attrs.map(attr => step ? ratingRow(attr, step) : finalRow(attr)).join('');
  return `<div class="rating-table-wrap">
    <h4>${esc(title)}</h4>
    <p class="hint">${esc(hint)}</p>
    <table class="rating-table"><thead><tr><th>Attribute</th><th>Step rating → final rating</th><th>Gap</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}
function stepCard(path, step, idx) {
  const vAvg = avgRating(path.vehicleAttrs, step);
  const dAvg = avgRating(path.driverAttrs, step);
  return `<details class="step-card" ${idx===0 ? 'open' : ''}>
    <summary>
      <div class="step-head"><span class="step-index">${idx + 1}</span><div><span class="step-label">${esc(step.label)}</span><h3>${esc(step.title)}</h3><div class="note">${esc(step.note)}</div></div></div>
      <div class="step-score"><span>Vehicle/System avg</span><b>${vAvg}/10</b><span>Driver/Person avg</span><b>${dAvg}/10</b></div>
    </summary>
    <div class="step-content">
      ${tableHtml('Vehicle / System: required attributes in this state', 'This rating shows how much of the external system/vehicle needs to exist at this step.', path.vehicleAttrs, step)}
      ${tableHtml('Driver / Person: required attributes in this state', 'This rating shows the skill/behavior level required at this exact step.', path.driverAttrs, step)}

}
function pathCard(goal, path, pathIndex) {
  const stepsHtml = goal.steps.map((step, idx) => stepCard(path, step, idx)).join('');
  const id = `${goal.id}-${pathIndex}`;
  return `<article class="path-card" data-name="${esc(path.name.toLowerCase())}">
    <header class="path-summary">
      <div class="path-title"><span class="num">${icon(goalIcon(goal.id))}</span><div><h2>${esc(path.name)}</h2><p>${esc(path.description)}</p></div></div>

        <button class="tab" data-target="${id}-vehicle">${icon('chart')}Final Vehicle/System Rating</button>
        <button class="tab" data-target="${id}-driver">${icon('user')}Final Driver/Person Rating</button>

function currentGoal() { return DATA.find(g => g.id === goalSelect.value) || DATA[0]; }
function renderGoalOptions() {
  goalSelect.innerHTML = DATA.map(g => `<option value="${esc(g.id)}">${esc(g.title)}</option>`).join('');
}
function renderPathOptions(goal) {
  pathSelect.innerHTML = goal.paths.map((p, i) => `<option value="${i}">${esc(p.name)}</option>`).join('');
}
function renderCards() {
  const goal = currentGoal();
  const i = Number(pathSelect.value || 0);
  const p = goal.paths[i];
  const html = p ? pathCard(goal, p, i) : `<div class="empty">No path found.</div>`;
  cards.innerHTML = html;
  bindTabs();
  filterCards();
  normalizeVisibleText(cards);
}
function bindTabs() {
  document.querySelectorAll('.tabs').forEach(group => {
    group.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const body = btn.closest('.path-body');
        body.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        body.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        const panel = body.querySelector('#' + CSS.escape(btn.dataset.target));
        if (panel) panel.classList.add('active');
      });
    });
  });
}
function filterCards() {
  const q = search.value.trim().toLowerCase();
  document.querySelectorAll('.path-card').forEach(card => {
    card.style.display = !q || card.innerText.toLowerCase().includes(q) ? '' : 'none';
  });
}
function normalizeVisibleText(root=document.body) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      return /^(SCRIPT|STYLE)$/.test(node.parentElement?.tagName || '')
        ? NodeFilter.FILTER_REJECT
        : NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const next = clean(node.nodeValue);
    if (next !== node.nodeValue) node.nodeValue = next;
  });
}
document.getElementById('openAll').addEventListener('click', () => {
  document.querySelectorAll('details.step-card').forEach(d => d.open = true);
});
document.getElementById('closeAll').addEventListener('click', () => {
  document.querySelectorAll('details.step-card').forEach(d => d.open = false);
});
goalSelect.addEventListener('change', () => { renderPathOptions(currentGoal()); search.value = ''; renderCards(); });
pathSelect.addEventListener('change', renderCards);
search.addEventListener('input', filterCards);

renderGoalOptions();
renderPathOptions(currentGoal());
renderCards();
normalizeVisibleText();
</script>
